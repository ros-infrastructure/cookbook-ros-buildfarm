# ============================================================================
# Bot Protection Actions - Server/Location Block Include
# ============================================================================
# IMPORTANT: Include this file in server or location blocks
# These are the actual blocking/logging actions based on detection
#
# Requires: bot-maps.conf to be loaded in http block first
#
# Usage in nginx.conf:
#   http {
#       include conf.d/bot-protection/bot-maps.conf;
#
#       server {
#           include conf.d/bot-protection/bot-actions.conf;
#           location / { ... }
#       }
#   }
# ============================================================================

# Bot protection actions using status map from 15-bot-protection-maps.conf
#
# access_log is only allowed inside an `if` block in location context, not
# server context, so conditional logging uses access_log's if= parameter
# (driven by the $log_bot_blocked/$log_suspicious_browser maps) at server
# level instead of being nested inside the if blocks below.

access_log /var/log/nginx/bot_blocked.log combined if=$log_bot_blocked;
access_log /var/log/nginx/suspicious_browser.log combined if=$log_suspicious_browser;

# Deny blocked bots
if ($bot_protection = "blocked") {
    return 403;
}
