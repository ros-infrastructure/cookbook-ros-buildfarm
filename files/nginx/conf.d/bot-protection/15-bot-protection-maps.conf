# ============================================================================
# Bot Protection Status Map
# ============================================================================
# Helper map that works with auto-generated detection maps (10-bot-detection.conf)
# Provides a simple combined status for conditional logic
#
# Provides:
#   $bot_protection - Combined status (allowed/blocked/suspicious)
# ============================================================================

# Bot protection status map
# Combines detection results into a simple status variable
map $is_bot:$is_suspicious_browser $bot_protection {
    default "allowed";
    1:~ "blocked";
    ~:1 "suspicious";
}

# Per-outcome logging flags for use with access_log's if= parameter.
# access_log is not permitted inside an `if` block in server context, so
# conditional logging is done this way instead of inside bot-actions.conf.
map $bot_protection $log_bot_blocked {
    default 0;
    "blocked" 1;
}
map $bot_protection $log_suspicious_browser {
    default 0;
    "suspicious" 1;
}
