---
driver:
  name: dokken
  chef_version: <%= ENV['CHEF_VERSION'] || 'latest' %>
  use_sudo: false
  chef_image: cincproject/cinc
  privileged: true
  env: [CHEF_LICENSE=accept]

transport:
  name: dokken

provisioner:
  name: dokken
  product_name: cinc_solo
  chef_binary: /opt/cinc/bin/cinc-solo
  chef_log_level: info
  chef_output_format: doc
  client_rb:
    environment: test

platforms:
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get install -y needrestart

verifier:
  name: inspec

suites:
  - name: agent
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[ros_buildfarm::agent]
    verifier:
      inspec_tests:
        - test/integration/agent
    attributes:
  - name: jenkins
    data_bags_path: "test/integration/data_bags"
    attributes:
      ros_buildfarm:
        smtp: true
    run_list:
      - recipe[ros_buildfarm::agent]
      - recipe[ros_buildfarm::jenkins]
    verifier:
      inspec_tests:
        - test/integration/jenkins
  - name: jenkins-anubis
    data_bags_path: "test/integration/data_bags"
    attributes:
      ros_buildfarm:
        letsencrypt_enabled: true
      jenkins:
        anubis: true
    run_list:
      - recipe[ros_buildfarm::agent]
      - recipe[ros_buildfarm::jenkins]
    verifier:
      inspec_tests:
        - test/integration/jenkins-anubis
  - name: repo
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[ros_buildfarm::repo]
    verifier:
      inspec_tests:
        - test/integration/repo
