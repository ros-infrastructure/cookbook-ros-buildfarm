---
driver:
  name: dokken
  chef_version: <%= ENV['CHEF_VERSION'] || 'latest' %>
  use_sudo: false
  chef_image: cincproject/cinc
  privileged: true
  env: [CHEF_LICENSE=accept]

transport:
  name: dokken

provisioner:
  name: dokken
  product_name: cinc_solo
  chef_binary: /opt/cinc/bin/cinc-solo
  chef_log_level: info
  chef_output_format: doc
  client_rb:
    environment: test

platforms:
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get install -y needrestart

verifier:
  name: inspec

suites:
  - name: agent
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[ros_buildfarm::agent]
    verifier:
      inspec_tests:
        - test/integration/agent
    attributes:
  - name: jenkins
    data_bags_path: "test/integration/data_bags"
    attributes:
      ros_buildfarm:
        smtp: true
    run_list:
      - recipe[ros_buildfarm::agent]
      - recipe[ros_buildfarm::jenkins]
    verifier:
      inspec_tests:
        - test/integration/jenkins
  - name: plugins
    driver:
      intermediate_instructions:
        # Repeated from the platform, a suite-level list replaces it.
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get install -y needrestart
        # Pre-seed a dummy plugin which is not in the plugins attribute so that
        # the removal of unlisted plugins in recipes/plugins.rb is exercised.
        # It depends on an equally unlisted dummy-dependency, which must be
        # removed too, and on the listed structs plugin, which must be kept.
        # The plugin manager runs as jenkins and reads the installed plugins'
        # manifests, so the directory must be owned by jenkins (created ahead
        # of the package, which reuses it) and the plugins must be archives
        # with a manifest. The plugins present after seeding are recorded in
        # /root/seeded-jenkins-plugins.txt so that the tests can tell that the
        # dummies existed before the converge removed them.
        - RUN useradd --system --user-group --home-dir /var/lib/jenkins --shell /bin/bash jenkins
        - >-
          RUN mkdir -p /var/lib/jenkins/plugins &&
          python3 -c "import zipfile; [zipfile.ZipFile('/var/lib/jenkins/plugins/%s.jpi' % n, 'w').writestr('META-INF/MANIFEST.MF', 'Manifest-Version: 1.0\nShort-Name: %s\nPlugin-Version: 1.0\n%s' % (n, 'Plugin-Dependencies: %s\n' % d if d else '')) for n, d in [('dummy-plugin', 'dummy-dependency:1.0,structs:362.va_b_695ef4fdf9'), ('dummy-dependency', None)]]" &&
          ls -1 /var/lib/jenkins/plugins > /root/seeded-jenkins-plugins.txt &&
          chown -R jenkins:jenkins /var/lib/jenkins
    run_list:
      - recipe[ros_buildfarm::plugins]
    verifier:
      inspec_tests:
        - test/integration/plugins
  - name: jenkins-anubis
    data_bags_path: "test/integration/data_bags"
    attributes:
      ros_buildfarm:
        letsencrypt_enabled: true
      jenkins:
        anubis: true
    run_list:
      - recipe[ros_buildfarm::agent]
      - recipe[ros_buildfarm::jenkins]
    verifier:
      inspec_tests:
        - test/integration/jenkins-anubis
  - name: repo
    data_bags_path: "test/integration/data_bags"
    run_list:
      - recipe[ros_buildfarm::repo]
    verifier:
      inspec_tests:
        - test/integration/repo
