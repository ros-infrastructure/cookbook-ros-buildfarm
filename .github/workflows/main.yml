name: ci

# yamllint disable-line rule:truthy
on:
  push:
    branches: [latest]
  pull_request:
    branches: ['*']

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: Run yaml Lint
        uses: actionshub/yamllint@main
  kitchen-ci:
    runs-on: ubuntu-24.04
    name: Kitchen CI
    strategy:
      matrix:
        suite:
          - 'agent'
          - 'repo'
          - 'jenkins'
          - 'jenkins-anubis'
        chef_version:
          - '19'
        os:
          - 'ubuntu-2404'
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: Install Cinc
        uses: actionshub/chef-install@main
        with:
          omnitruckUrl: omnitruck.cinc.sh
          project: cinc-workstation
      - name: Test-Kitchen
        uses: actionshub/test-kitchen@main
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
        env:
          CHEF_VERSION: ${{ matrix.chef_version }}
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
      - name: Print debug output (journalctl)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "journalctl -l"
      - name: Print debug output on failure (jenkins.log)
        if: failure() && startsWith(matrix.suite, 'jenkins')
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "cat /var/log/jenkins/jenkins.log"
      - name: Print debug output on failure (systemctl jenkins status)
        if: failure() && startsWith(matrix.suite, 'jenkins')
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "systemctl status jenkins"
      - name: Print debug output (jenkins-agent)
        if: failure()
        run: |
            set -x
            KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec \
                ${{ matrix.suite }}-${{ matrix.os }} \
                -c "systemctl status jenkins-agent"
  kitchen-ci-windows:
    runs-on: ${{ matrix.os }}
    name: Kitchen CI (Windows)
    timeout-minutes: 60
    strategy:
      matrix:
        suite:
          - 'windows-agent'
        os:
          - 'windows-2022'
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: Install Cinc
        uses: actionshub/chef-install@main
        with:
          omnitruckUrl: omnitruck.cinc.sh
          project: cinc-workstation
          windowsPath: 'C:\cinc-project\cinc-workstation\'
      - name: Test-Kitchen (converge)
        uses: actionshub/test-kitchen@main
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
          action: converge
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.windows.yml
      # Verify runs in its own step with a timeout: InSpec's local Windows
      # backend has no command timeout, so a hang would otherwise only end
      # when the job does.
      - name: Test-Kitchen (verify)
        timeout-minutes: 20
        uses: actionshub/test-kitchen@main
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
          action: verify
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.windows.yml
          KITCHEN_LOG: debug
      - name: Print debug output (jenkins-agent)
        if: failure()
        shell: pwsh
        run: |
            $ErrorActionPreference = 'Continue'
            Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" |
              Select-Object ProcessId, ParentProcessId, CommandLine |
              Format-List
            Get-Service jenkins-agent | Format-List *
            Get-Content C:\jenkins-agent\jenkins-agent.xml
            Get-ChildItem C:\jenkins-agent\logs -File | ForEach-Object {
              "=== $($_.FullName)"
              Get-Content $_.FullName -Tail 200
            }
